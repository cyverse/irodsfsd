# irodsfsd accepts this YAML format and the equivalent JSON object.
service_endpoint: tcp://127.0.0.1:13020
debug: false
irodsfs_executable_path: /usr/local/bin/irodsfs
mount_executable_path: /usr/bin/mount
unmount_executable_path: /usr/bin/umount
data_root_path: /var/lib/irodsfsd
pid_file: /run/irodsfsd/irodsfsd.pid
log_root_path: /var/log/irodsfsd
mount_root_path: /var/lib/irodsfsd/mounts

recovery_encryption_key: ""

allowed_mount_root_paths:
  - /mnt/irods
  - /var/lib/kubelet

# Force the FUSE allow_other mount option onto every irodsfs/DAVFS mount
# (not NFS). Required when non-root local accounts need to access a mount
# created by the root-running daemon. Does NOT also force
# default_permissions: a caller's UID/GID (e.g. from irods-csi-driver) may be
# a container-local identity with no host mapping, so kernel-enforced
# ownership checks against it can't be trusted. The packaged service runs as
# root, which may use allow_other without user_allow_other in /etc/fuse.conf.
allow_fuse_allow_other: true

# Retry a mount after it was successfully mounted and then crashes.
# Initial mount failures use retry settings regardless of this value.
auto_remount: false
# Restore ordinary persisted mounts when irodsfsd starts. Unmount cleanup is
# always resumed.
restore_mounts_on_restart: false

retry:
  max_attempts: 5
  initial_delay: 1s
  max_delay: 30s
  multiplier: 2
  jitter: 0.2

mount_timeout: 30s
unmount_timeout: 15s
davfs_unmount_timeout: 3m
reconcile_interval: 10s
max_concurrent_mounts: 40

management_service_port: 13021
